name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Configure authenticated remote (optional bypass token)
        shell: bash
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_BOT_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${{ github.repository }}.git"
            echo "Using RELEASE_BOT_TOKEN for push/tag operations."
          else
            echo "Using default GITHUB_TOKEN for push/tag operations."
          fi

      - name: Resolve version strategy
        id: versioning
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          BASE_SHA="${{ github.event.before }}"
          MANUAL_BUMP="false"

          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            PREV_VERSION="$(git show "${BASE_SHA}:package.json" | node -e "process.stdin.setEncoding('utf8');let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version));")"
            if [ "${PREV_VERSION}" != "${CURRENT_VERSION}" ]; then
              MANUAL_BUMP="true"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_VERSION="$(git show "HEAD^:package.json" | node -e "process.stdin.setEncoding('utf8');let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version));")"
            if [ "${PREV_VERSION}" != "${CURRENT_VERSION}" ]; then
              MANUAL_BUMP="true"
            fi
          fi

          echo "manual_bump=${MANUAL_BUMP}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Auto bump patch (if needed)
        id: bump
        if: steps.versioning.outputs.manual_bump != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version
          NEW_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          git add package.json
          git commit -m "chore(release): bump version to v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:master --follow-tags

      - name: Tag manual version (if needed)
        if: steps.versioning.outputs.manual_bump == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.versioning.outputs.current_version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skipping tag creation."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.versioning.outputs.manual_bump }}" = "true" ]; then
            VERSION="${{ steps.versioning.outputs.current_version }}"
          else
            VERSION="${{ steps.bump.outputs.new_version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check if version already exists on npm
        id: npm_check
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          VERSION="${{ steps.release_meta.outputs.version }}"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_NAME}@${VERSION} already exists on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.exists != 'true'
        run: npm publish --access public --provenance
