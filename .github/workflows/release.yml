name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Decide whether to bump patch
        id: versioning
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          PREV_VERSION=""

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              PREV_VERSION="$(git show "$BEFORE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || true)"
            fi
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREV_VERSION="$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || true)"
          fi

          if [ -n "$PREV_VERSION" ] && [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "Version was incremented manually ($PREV_VERSION -> $CURRENT_VERSION)."
            echo "did_bump=false" >> "$GITHUB_OUTPUT"
            echo "release_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            npm version patch --no-git-tag-version
            NEW_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
            echo "did_bump=true" >> "$GITHUB_OUTPUT"
            echo "release_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bump
        if: ${{ steps.versioning.outputs.did_bump == 'true' && github.ref_name == 'master' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ github.repository }}.git"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.release_version }} [skip release]"
          git push origin HEAD:master

      - name: Skip if version already exists on npm
        id: npm_check
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          REL_VERSION="${{ steps.versioning.outputs.release_version }}"
          if npm view "${PKG_NAME}@${REL_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ steps.npm_check.outputs.already_published != 'true' }}
        run: bun install --frozen-lockfile

      - name: Publish to npm
        if: ${{ steps.npm_check.outputs.already_published != 'true' }}
        run: npm publish --access public --provenance

      - name: Summary
        run: |
          echo "Release version: ${{ steps.versioning.outputs.release_version }}"
          echo "Bumped automatically: ${{ steps.versioning.outputs.did_bump }}"
          echo "Already published: ${{ steps.npm_check.outputs.already_published }}"
